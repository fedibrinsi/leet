version: '3.8'

services:
  idor-challenge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idor-challenge
    ports:
      - "5001:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - idor-network

networks:
  idor-network:
    driver: bridge
